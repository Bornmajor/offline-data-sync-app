name: Build Android APK Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile from eas.json
        required: true
        default: preview
        type: choice
        options:
          - preview
          - preview2
          - preview3
          - preview4
          - production
      release_tag:
        description: Git tag for GitHub Release (used in manual runs)
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "release_tag=v0.0.0-main-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=${{ github.event.inputs.profile }}" >> "$GITHUB_OUTPUT"
          else
            echo "profile=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx jest --watchAll=false

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK with EAS and download artifact
        id: eas_build
        run: |
          PROFILE="${{ steps.release_meta.outputs.profile }}"
          echo "Using EAS profile: $PROFILE"

          BUILD_JSON=$(eas build --platform android --profile "$PROFILE" --non-interactive --wait --json)
          echo "$BUILD_JSON" > eas-build.json

          ARTIFACT_URL=$(node -e "const fs=require('fs');const raw=fs.readFileSync('eas-build.json','utf8');const parsed=JSON.parse(raw);const build=Array.isArray(parsed)?parsed[0]:parsed;const url=(build?.artifacts?.buildUrl)||(build?.artifacts?.applicationArchiveUrl)||'';if(!url){process.exit(1);}process.stdout.write(url);")
          BUILD_ID=$(node -e "const fs=require('fs');const raw=fs.readFileSync('eas-build.json','utf8');const parsed=JSON.parse(raw);const build=Array.isArray(parsed)?parsed[0]:parsed;process.stdout.write(build?.id||'');")

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

          curl -L "$ARTIFACT_URL" -o app-release.apk
          test -f app-release.apk
          ls -lh app-release.apk

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          name: Android APK ${{ steps.release_meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: app-release.apk
          fail_on_unmatched_files: true

      - name: Publish workflow summary
        run: |
          {
            echo "### APK Release Created"
            echo "- Tag: ${{ steps.release_meta.outputs.release_tag }}"
            echo "- EAS Build ID: ${{ steps.eas_build.outputs.build_id }}"
            echo "- EAS Artifact URL: ${{ steps.eas_build.outputs.artifact_url }}"
            echo "- GitHub Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.release_meta.outputs.release_tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
